name: Release

# Push a tag like v0.2.0 to build Rosa.app and attach it to a GitHub release.
# Canary tags (v0.2.0-canary.3) are published by canary.yml.
on:
  push:
    tags: ["v*", "!v*-*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # tags and history, for the release notes fallback

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" Resources/Info.plist

      - name: Build
        run: scripts/build.sh release

      - name: Package
        run: ditto -c -k --keepParent build/Rosa.app "build/Rosa-${GITHUB_REF_NAME}.zip"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/release-notes.sh "$GITHUB_REF_NAME" > build/notes.md
          # "Full Changelog" from the previous stable release, not the last canary.
          PREVIOUS=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
          gh release create "$GITHUB_REF_NAME" "build/Rosa-${GITHUB_REF_NAME}.zip" \
            --notes-file build/notes.md --generate-notes ${PREVIOUS:+--notes-start-tag "$PREVIOUS"} \
            --title "Rosa $GITHUB_REF_NAME"
